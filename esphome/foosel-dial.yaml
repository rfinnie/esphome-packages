---
# For diagrams and STLs: https://github.com/foosel/SonosRemote
esphome:
  name: "foosel-dial"
  friendly_name: "Foosel Dial"

esp8266:
  board: "d1_mini"

logger:

api:

ota:
  platform: "esphome"

captive_portal:

sensor:
  - platform: "rotary_encoder"
    name: "Dial"
    id: "dial"
    pin_a: "GPIO12"
    pin_b: "GPIO13"

  - platform: "wifi_signal"
    name: "WiFi Signal Sensor"
    update_interval: "60s"

binary_sensor:
  - platform: "gpio"
    pin:
      number: "GPIO14"
      mode:
        input: true
        pullup: true
      inverted: true
    id: "raw_button_state"
    internal: true
    filters:
      - delayed_on: "30ms"
      - delayed_off: "30ms"
    on_multi_click:
      - timing:
          - "ON for 40ms to 400ms"
          - "OFF for at least 330ms"
        then:
          - event.trigger:
              id: "button"
              event_type: "initial_press"
      - timing:
          - "ON for 40ms to 400ms"
          - "OFF for 40ms to 300ms"
          - "ON for 40ms to 400ms"
          - "OFF for at least 330ms"
        then:
          - event.trigger:
              id: "button"
              event_type: "multi_press_2"
      - timing:
          - "ON for 40ms to 400ms"
          - "OFF for 40ms to 300ms"
          - "ON for 40ms to 400ms"
          - "OFF for 40ms to 300ms"
          - "ON for 40ms to 400ms"
          - "OFF for at least 50ms"
        then:
          - event.trigger:
              id: "button"
              event_type: "multi_press_3"
      - timing:
          - "ON for at least 2s"
        then:
          - event.trigger:
              id: "button"
              event_type: "long_press"

event:
  - platform: "template"
    id: "button"
    name: "Button"
    device_class: "button"
    event_types:
      - "initial_press"
      - "multi_press_2"
      - "multi_press_3"
      - "long_press"
